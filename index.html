<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Florencia Moreira · Psicóloga en Uruguay</title>
<meta id="meta-description" name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav wrap">
    <a class="brand" href="#inicio">
      <img id="brand-logo" src="/images/logo.svg" alt="Logo" onerror="this.style.display='none'">
      <span class="brand-text"><strong id="brand-name"></strong><span id="brand-role"></span></span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">&#9776;</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="#inicio">Inicio</a></li>
      <li><a href="#modalidades">Modalidades</a></li>
      <li><a href="#sobre-mi">Sobre mí</a></li>
      <li><a href="#especialidades">Especialidades</a></li>
      <li><a href="#contacto">Contacto</a></li>
    </ul>
  </nav>
</header>

<main>
  <!-- HERO -->
  <section class="hero" id="inicio">
    <div class="wrap hero-grid">
      <div>
        <span class="eyebrow" id="hero-eyebrow"></span>
        <h1><span id="hero-title1"></span><br><span id="hero-title2"></span></h1>
        <p class="lead" id="hero-subtitle"></p>
        <div class="hero-ctas">
          <a class="btn btn-primary" id="hero-cta1" href="#modalidades"></a>
          <a class="btn btn-ghost" id="hero-cta2" href="#contacto"></a>
        </div>
      </div>
      <figure class="hero-media">
        <img id="hero-image" src="/images/hero.jpg" alt="Florencia Moreira">
        <figcaption id="hero-caption"></figcaption>
      </figure>
    </div>
  </section>

  <!-- MODALIDADES -->
  <section class="section-alt" id="modalidades">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow" id="mod-eyebrow"></span>
        <h2 id="mod-title"></h2>
      </div>
      <div class="modality-grid" id="mod-grid"></div>
    </div>
  </section>

  <!-- SOBRE MI -->
  <section id="sobre-mi">
    <div class="wrap about-grid">
      <img id="about-image" src="/images/hero.jpg" alt="Florencia Moreira">
      <div>
        <span class="eyebrow" id="about-eyebrow"></span>
        <h2 id="about-title"></h2>
        <ul class="bullets" id="about-bullets"></ul>
        <span class="areas-label" id="about-areas-label"></span>
        <div class="chip-row" id="about-areas"></div>
      </div>
    </div>
  </section>

  <!-- ESPECIALIDADES -->
  <section class="section-alt" id="especialidades">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow" id="spec-eyebrow"></span>
        <h2 id="spec-title"></h2>
      </div>
      <div class="specialty-grid" id="spec-grid"></div>
      <div class="article-list" id="article-list"></div>
    </div>
  </section>

  <!-- CONTACTO -->
  <section id="contacto">
    <div class="wrap contact-grid">
      <div class="contact-info">
        <span class="eyebrow" id="contact-eyebrow"></span>
        <h2 id="contact-title"></h2>
        <p id="contact-subtitle" style="color:var(--ink-soft); max-width:38ch;"></p>
        <div id="contact-lines"></div>
        <div class="social-row" id="social-row"></div>
      </div>

      <form class="contact-form" name="contacto" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="contactForm">
        <input type="hidden" name="form-name" value="contacto">
        <p style="display:none"><label>No completar: <input name="bot-field"></label></p>
        <h3 id="form-title" style="font-size:20px; margin-bottom:20px;"></h3>
        <label id="label-name" for="f-name"></label>
        <input id="f-name" name="nombre" type="text" required>
        <label id="label-email" for="f-email"></label>
        <input id="f-email" name="email" type="email">
        <label id="label-message" for="f-message"></label>
        <textarea id="f-message" name="mensaje" required></textarea>
        <div class="form-status" id="formStatus"></div>
        <button class="btn btn-primary" type="submit" id="form-submit" style="width:100%; justify-content:center;"></button>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap footer-row">
    <span id="footer-name"></span>
    <span id="footer-text"></span>
    <a id="footer-email" href="#"></a>
  </div>
</footer>

<a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">

</a>

<script src="/js/main.js"></script>
</body>
</html>
